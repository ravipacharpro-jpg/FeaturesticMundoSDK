name: Build FeaturesticMundoSDK AAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components & NDK
        run: |
          sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build FeaturesticMundo Release AAR
        run: |
          chmod +x ./gradlew
          ./gradlew clean :FeaturesticMundo:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp FeaturesticMundo/build/outputs/aar/FeaturesticMundo-release.aar dist/FeaturesticMundo-release.aar
          ls -lh dist/FeaturesticMundo-release.aar

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeaturesticMundo-release-aar
          path: dist/FeaturesticMundo-release.aar

      - name: Publish Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 && gh release delete v1.0.0 --yes --cleanup-tag || true
          git push origin --delete v1.0.0 >/dev/null 2>&1 || true
          gh release create v1.0.0 dist/FeaturesticMundo-release.aar#FeaturesticMundo-release.aar \
            --title "FeaturesticMundoSDK v1.0.0" \
            --notes "Full-source Mundo-compatible zero-copy Android virtualization SDK." \
            --target "$GITHUB_SHA"
